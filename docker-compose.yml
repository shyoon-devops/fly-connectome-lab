services:
  fly-connectome-lab:
    build: .
    container_name: fly-connectome-lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:8510:8501"
    environment:
      TZ: Asia/Seoul
      DEPLOYMENT_MODE: server
      MAX_WS_CONNECTIONS: 12
      MAX_WS_PER_IP: 2
      MAX_WS_MESSAGES_PER_SECOND: 24
    volumes:
      - ./data/runtime:/app/data/runtime
    deploy:
      resources:
        limits:
          memory: 4G
